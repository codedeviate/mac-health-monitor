<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26365f"/>
      <stop offset="1" stop-color="#0c1329"/>
    </linearGradient>
    <linearGradient id="housing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a414f"/>
      <stop offset="1" stop-color="#222833"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a4d"/>
      <stop offset="1" stop-color="#e0352b"/>
    </linearGradient>
    <radialGradient id="greenLit" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#b9ffcb"/>
      <stop offset="0.45" stop-color="#3ee06a"/>
      <stop offset="1" stop-color="#1c9a41"/>
    </radialGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <!-- road -->
    <rect x="100" y="790" width="824" height="140" fill="#161d33"/>
    <rect x="100" y="786" width="824" height="8" fill="#3b4870"/>

    <!-- traffic light -->
    <rect x="688" y="700" width="44" height="100" fill="#222833"/>
    <rect x="600" y="170" width="220" height="560" rx="72" fill="url(#housing)" stroke="#121620" stroke-width="10"/>
    <circle cx="710" cy="275" r="68" fill="#7c2a30"/>
    <circle cx="710" cy="450" r="68" fill="#7d6522"/>
    <circle cx="710" cy="625" r="90" fill="#3ee06a" opacity="0.55" filter="url(#glow)"/>
    <circle cx="710" cy="625" r="68" fill="url(#greenLit)"/>

    <!-- speed streaks -->
    <g stroke-linecap="round" stroke="#9fb4ff">
      <line x1="140" y1="640" x2="270" y2="640" stroke-width="18" opacity="0.85"/>
      <line x1="115" y1="695" x2="255" y2="695" stroke-width="18" opacity="0.6"/>
      <line x1="150" y1="750" x2="255" y2="750" stroke-width="18" opacity="0.4"/>
    </g>

    <!-- car, leaning forward for speed -->
    <g transform="translate(40 130) scale(0.82) skewX(-14) translate(140 0)">
      <path d="M 285 770
               L 272 690
               Q 270 655 310 645
               L 375 635
               Q 420 560 480 552
               L 560 552
               Q 600 556 640 620
               L 700 640
               Q 735 650 738 700
               L 735 770 Z" fill="url(#car)"/>
      <!-- windows -->
      <path d="M 395 636 Q 430 580 480 574 L 505 574 L 505 636 Z" fill="#bfe3ff"/>
      <path d="M 525 574 L 556 574 Q 585 580 615 636 L 525 636 Z" fill="#bfe3ff"/>
      <!-- headlight beam hint -->
      <rect x="712" y="668" width="26" height="16" rx="6" fill="#fff4b0"/>
      <!-- wheels -->
      <circle cx="365" cy="772" r="54" fill="#141821"/>
      <circle cx="365" cy="772" r="22" fill="#9aa3b5"/>
      <circle cx="640" cy="772" r="54" fill="#141821"/>
      <circle cx="640" cy="772" r="22" fill="#9aa3b5"/>
    </g>
  </g>
</svg>
